AWSTemplateFormatVersion: '2010-09-09'
Description: Initial infrastructure for the Globomantics orders release and rollback lab.

Resources:
  LabVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: globomantics-orders-lab-vpc

  LabInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: globomantics-orders-lab-igw

  LabInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId:
        Ref: LabInternetGateway
      VpcId:
        Ref: LabVpc

  LabPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs:
              Ref: AWS::Region
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: globomantics-orders-lab-public-subnet
      VpcId:
        Ref: LabVpc

  LabPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      Tags:
        - Key: Name
          Value: globomantics-orders-lab-public-routes
      VpcId:
        Ref: LabVpc

  LabDefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: LabInternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: LabInternetGateway
      RouteTableId:
        Ref: LabPublicRouteTable

  LabPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: LabPublicRouteTable
      SubnetId:
        Ref: LabPublicSubnet

  LabWorkstationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH access to the lab workstation.
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: '-1'
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0
          FromPort: 22
          IpProtocol: tcp
          ToPort: 22
      VpcId:
        Ref: LabVpc

  OrdersLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      RoleName: globomantics-orders-lambda-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  OrdersCodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRoleForLambda
      RoleName: globomantics-orders-codedeploy-service-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole

  LabWorkstationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: globomantics-orders-workstation-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: globomantics-orders-workstation-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InspectAndInvokeOrdersWorkload
                Effect: Allow
                Action:
                  - lambda:GetAlias
                  - lambda:GetFunctionConfiguration
                  - lambda:InvokeFunction
                  - lambda:ListVersionsByFunction
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:globomantics-orders
                  - Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:globomantics-orders:*
              - Sid: OperateOrdersDeployment
                Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:GetDeploymentGroup
                  - codedeploy:ListDeployments
                  - codedeploy:RegisterApplicationRevision
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:application:globomantics-orders-app
                  - Fn::Sub: arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:globomantics-orders-app/globomantics-orders-dg
                  - Fn::Sub: arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:CodeDeployDefault.LambdaCanary10Percent30Minutes
              - Sid: StopOrdersDeployment
                Effect: Allow
                Action: codedeploy:StopDeployment
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:globomantics-orders-app/globomantics-orders-dg
              - Sid: InspectOrdersAlarm
                Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarmHistory
                  - cloudwatch:DescribeAlarms
                Resource: '*'
              - Sid: SignalWorkstationReadiness
                Effect: Allow
                Action: cloudformation:SignalResource
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
        - PolicyName: globomantics-orders-v2-bootstrap
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PublishOrdersV2DuringBootstrap
                Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:UpdateFunctionCode
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:globomantics-orders
              - Sid: VerifyOrdersAlarmDatapointDuringBootstrap
                Effect: Allow
                Action: cloudwatch:GetMetricData
                Resource: '*'
              - Sid: RemoveOrdersV2BootstrapPermission
                Effect: Allow
                Action: iam:DeleteRolePolicy
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/globomantics-orders-workstation-role

  LabWorkstationInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: LabWorkstationRole

  OrdersFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {
                  "order_id": "order-1001",
                  "status": "confirmed",
                  "version": "v1"
              }
      FunctionName: globomantics-orders
      Handler: index.lambda_handler
      MemorySize: 128
      Role:
        Fn::GetAtt:
          - OrdersLambdaExecutionRole
          - Arn
      Runtime: python3.13

  OrdersV1Version:
    Type: AWS::Lambda::Version
    Properties:
      Description: Initial healthy v1 order confirmation function.
      FunctionName:
        Ref: OrdersFunction

  OrdersProdAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName:
        Ref: OrdersFunction
      FunctionVersion:
        Fn::GetAtt:
          - OrdersV1Version
          - Version
      Name: prod

  OrdersCodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: globomantics-orders-app
      ComputePlatform: Lambda

  OrdersDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName:
        Ref: OrdersCodeDeployApplication
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_STOP_ON_REQUEST
      DeploymentConfigName: CodeDeployDefault.LambdaCanary10Percent30Minutes
      DeploymentGroupName: globomantics-orders-dg
      DeploymentStyle:
        DeploymentOption: WITH_TRAFFIC_CONTROL
        DeploymentType: BLUE_GREEN
      ServiceRoleArn:
        Fn::GetAtt:
          - OrdersCodeDeployServiceRole
          - Arn

  OrdersErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Alarm when real prod-alias traffic records an error.
      AlarmName: globomantics-orders-errors
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Metrics:
        - Id: errors
          MetricStat:
            Metric:
              Dimensions:
                - Name: FunctionName
                  Value:
                    Ref: OrdersFunction
                - Name: Resource
                  Value:
                    Fn::Sub: ${OrdersFunction}:prod
              MetricName: Errors
              Namespace: AWS/Lambda
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: invocations
          MetricStat:
            Metric:
              Dimensions:
                - Name: FunctionName
                  Value:
                    Ref: OrdersFunction
                - Name: Resource
                  Value:
                    Fn::Sub: ${OrdersFunction}:prod
              MetricName: Invocations
              Namespace: AWS/Lambda
            Period: 60
            Stat: Sum
          ReturnData: false
        - Expression: IF(invocations>0,FILL(errors,0))
          Id: health
          ReturnData: true
      Threshold: 0
      TreatMissingData: notBreaching

  LabWorkstation:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT10M
    DependsOn:
      - OrdersProdAlias
      - OrdersErrorsAlarm
      - LabPublicSubnetRouteTableAssociation
    Properties:
      IamInstanceProfile:
        Ref: LabWorkstationInstanceProfile
      ImageId: '%ami-259%'
      InstanceType: t3.small
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: '0'
          GroupSet:
            - Ref: LabWorkstationSecurityGroup
          SubnetId:
            Ref: LabPublicSubnet
      Tags:
        - Key: Name
          Value: globomantics-orders-lab-workstation
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            set -euo pipefail
            echo 'cloud_user:%password%' | chpasswd
            LAB_ROOT=/home/cloud_user/lab
            V2_ARCHIVE=$LAB_ROOT/assets/function/v2.zip
            V2_SHA256=2027a77a46868f6ac0a806d6cf0c5971fddcc72e8196009a507248fedcce72de
            FUNCTION_NAME=globomantics-orders
            ALARM_NAME=globomantics-orders-errors
            ROLE_NAME=globomantics-orders-workstation-role
            BOOTSTRAP_POLICY_NAME=globomantics-orders-v2-bootstrap
            ALARM_MAX_ATTEMPTS=48
            ALARM_POLL_SECONDS=5
            ASSET_BASE_URL=https://raw.githubusercontent.com/pluralsight-cloud/Lab-Release-and-Roll-Back-an-AWS-Cloud-Native-Workload/7106a715f0a404be6cedaa3635eb6135e4883fbd
            V2_ASSET=assets/function/v2.zip
            APPSPEC_ASSET=assets/appspec/release-v2.json
            APPSPEC_SHA256=f77f57264120e0bbc439d490d02cf887392ce0da1316985dfe9887f8b74b7c9c
            INVOKE_LOOP_ASSET=assets/helpers/invoke-loop.py
            INVOKE_LOOP_SHA256=3dbfc959b289b748bd4d5be3415f1ac65f5a8a7a243a33af9cd78dd5201ef544
            RECORD_OUTCOME_ASSET=assets/helpers/record-outcome.py
            RECORD_OUTCOME_SHA256=90aadab2525ac5843f10a8e55e295ebd922c47db401296c88a0237e7ada26b9c
            STACK_NAME=${AWS::StackName}
            AWS_REGION=${AWS::Region}
            INSTANCE_ID=$(cat /var/lib/cloud/data/instance-id 2>/dev/null || hostname)
            BOOTSTRAP_STAGE=bootstrap-start
            classify_update_error() {
              case "$1" in
                *'You must specify a region'*)
                  printf '%s\n' 'lambda-no-region'
                  ;;
                *'AccessDenied'*|*'not authorized to perform'*)
                  printf '%s\n' 'lambda-access-denied'
                  ;;
                *'Unknown options'*)
                  printf '%s\n' 'lambda-cli-unsupported'
                  ;;
                *)
                  printf '%s\n' 'lambda-update-timeout'
                  ;;
              esac
            }
            verify_seed_state() {
              ALIAS_STATE="$LAB_ROOT/state/prod-alias.json"; V1_INVOKE="$LAB_ROOT/state/v1-invoke.json"
              V1_PAYLOAD="$LAB_ROOT/state/v1-payload.json"; V2_INVOKE="$LAB_ROOT/state/v2-invoke.json"
              V2_PAYLOAD="$LAB_ROOT/state/v2-payload.json"
              aws lambda get-alias \
                --function-name "$FUNCTION_NAME" \
                --name prod \
                --output json \
                --no-cli-pager > "$ALIAS_STATE"
              aws lambda invoke \
                --function-name "$FUNCTION_NAME" \
                --qualifier 1 \
                --payload '{}' \
                --cli-binary-format raw-in-base64-out \
                --no-cli-pager \
                "$V1_PAYLOAD" > "$V1_INVOKE"
              aws lambda invoke \
                --function-name "$FUNCTION_NAME" \
                --qualifier 2 \
                --payload '{}' \
                --cli-binary-format raw-in-base64-out \
                --no-cli-pager \
                "$V2_PAYLOAD" > "$V2_INVOKE"

              python3 - \
                "$ALIAS_STATE" \
                "$V1_INVOKE" \
                "$V1_PAYLOAD" \
                "$V2_INVOKE" \
                "$V2_PAYLOAD" <<'PY'
            import json, sys
            alias, v1m, v1b, v2m, v2b = (json.load(open(p, encoding="utf-8")) for p in sys.argv[1:])
            checks = (
                alias.get("FunctionVersion") == "1", alias.get("RoutingConfig") in (None, {}),
                v1m.get("StatusCode") == 200 and v1m.get("FunctionError") is None and v1m.get("ExecutedVersion") == "1",
                v1b == {"order_id": "order-1001", "status": "confirmed", "version": "v1"},
                v2m.get("StatusCode") == 200 and v2m.get("FunctionError") == "Unhandled" and v2m.get("ExecutedVersion") == "2",
                v2b.get("errorType") == "RuntimeError" and v2b.get("errorMessage") == "Simulated v2 order-processing failure.",
            )
            if not all(checks):
                raise SystemExit("seed verification failed")
            PY
            }
            prewarm_alarm() {
              ALARM_QUERY='MetricAlarms[0].{AlarmName:AlarmName,ComparisonOperator:ComparisonOperator,DatapointsToAlarm:DatapointsToAlarm,EvaluationPeriods:EvaluationPeriods,Metrics:Metrics,StateValue:StateValue,Threshold:Threshold,TreatMissingData:TreatMissingData}'
              ALARM_BEFORE="$LAB_ROOT/state/alarm-before.json"
              ALARM_READY="$LAB_ROOT/state/alarm-ready.json"
              ALARM_ZERO="$LAB_ROOT/state/alarm-zero-datapoints.json"
              ALARM_V1_INVOKE=$(mktemp)
              ALARM_V1_PAYLOAD=$(mktemp)
              METRIC_DATA=$(mktemp)
              METRIC_QUERIES=$(mktemp)
              python3 - "$FUNCTION_NAME" > "$METRIC_QUERIES" <<'PY'
            import json
            import sys

            dimension = [
                dict(Name="FunctionName", Value=sys.argv[1]),
                dict(Name="Resource", Value=f"{sys.argv[1]}:prod"),
            ]
            metric_stat = lambda name: dict(
                Metric=dict(Namespace="AWS/Lambda", MetricName=name, Dimensions=dimension),
                Period=60,
                Stat="Sum",
            )
            print(json.dumps([
                dict(Id="errors", MetricStat=metric_stat("Errors"), ReturnData=False),
                dict(Id="invocations", MetricStat=metric_stat("Invocations"), ReturnData=False),
                dict(Id="health", Expression="IF(invocations>0,FILL(errors,0))", ReturnData=True),
            ]))
            PY
              aws cloudwatch describe-alarms \
                --alarm-names "$ALARM_NAME" \
                --query "$ALARM_QUERY" \
                --output json \
                --no-cli-pager > "$ALARM_BEFORE"
              ALARM_READY_REACHED=false
              for attempt in $(seq 1 "$ALARM_MAX_ATTEMPTS"); do
                aws lambda invoke \
                  --function-name "$FUNCTION_NAME" \
                  --qualifier prod \
                  --payload '{}' \
                  --cli-binary-format raw-in-base64-out \
                  --no-cli-pager \
                  "$ALARM_V1_PAYLOAD" > "$ALARM_V1_INVOKE"

                python3 - "$ALARM_V1_INVOKE" "$ALARM_V1_PAYLOAD" <<'PY'
            import json
            import sys

            invoke = json.load(open(sys.argv[1], encoding="utf-8"))
            payload = json.load(open(sys.argv[2], encoding="utf-8"))
            if invoke.get("StatusCode") != 200:
                raise SystemExit("alarm pre-warm v1 invoke did not return status 200")
            if invoke.get("FunctionError") is not None:
                raise SystemExit("alarm pre-warm v1 invoke returned FunctionError")
            if invoke.get("ExecutedVersion") != "1":
                raise SystemExit("alarm pre-warm invoke did not execute version 1")
            if payload != dict(order_id="order-1001", status="confirmed", version="v1"):
                raise SystemExit("alarm pre-warm v1 invoke returned an unexpected payload")
            PY

                aws cloudwatch describe-alarms \
                  --alarm-names "$ALARM_NAME" \
                  --query "$ALARM_QUERY" \
                  --output json \
                  --no-cli-pager > "$ALARM_READY"

                read -r METRIC_START METRIC_END < <(python3 - <<'PY'
            from datetime import datetime, timedelta, timezone

            end = datetime.now(timezone.utc)
            start = end - timedelta(minutes=5)
            timestamp = "%Y-%m-%dT%H:%M:%SZ"
            print(start.strftime(timestamp), end.strftime(timestamp))
            PY
                )
                aws cloudwatch get-metric-data \
                  --metric-data-queries "file://$METRIC_QUERIES" \
                  --start-time "$METRIC_START" \
                  --end-time "$METRIC_END" \
                  --output json \
                  --no-cli-pager > "$METRIC_DATA"

                if python3 - "$ALARM_READY" "$METRIC_DATA" <<'PY'
            import json
            import sys

            alarm = json.load(open(sys.argv[1], encoding="utf-8"))
            metric_data = json.load(open(sys.argv[2], encoding="utf-8"))
            expected = dict(
                AlarmName="globomantics-orders-errors",
                ComparisonOperator="GreaterThanThreshold",
                DatapointsToAlarm=1,
                EvaluationPeriods=1,
                Metrics=[
                    dict(
                        Id="errors",
                        MetricStat=dict(
                            Metric=dict(
                                Dimensions=[
                                    dict(Name="FunctionName", Value="globomantics-orders"),
                                    dict(Name="Resource", Value="globomantics-orders:prod"),
                                ],
                                MetricName="Errors",
                                Namespace="AWS/Lambda",
                            ),
                            Period=60,
                            Stat="Sum",
                        ),
                        ReturnData=False,
                    ),
                    dict(
                        Id="invocations",
                        MetricStat=dict(
                            Metric=dict(
                                Dimensions=[
                                    dict(Name="FunctionName", Value="globomantics-orders"),
                                    dict(Name="Resource", Value="globomantics-orders:prod"),
                                ],
                                MetricName="Invocations",
                                Namespace="AWS/Lambda",
                            ),
                            Period=60,
                            Stat="Sum",
                        ),
                        ReturnData=False,
                    ),
                    dict(Id="health", Expression="IF(invocations>0,FILL(errors,0))", ReturnData=True),
                ],
                StateValue="OK",
                Threshold=0.0,
                TreatMissingData="notBreaching",
            )
            if alarm != expected:
                raise SystemExit("orders errors alarm configuration is unexpected")
            results = metric_data.get("MetricDataResults") or []
            health = [result for result in results if result.get("Id") == "health"]
            if len(health) != 1 or not any(
                float(value) == 0 for value in health[0].get("Values", [])
            ):
                raise SystemExit("orders errors alarm OK state has no real zero-error datapoint")
            PY
                then
                  mv "$METRIC_DATA" "$ALARM_ZERO"
                  ALARM_READY_REACHED=true
                  break
                fi

                sleep "$ALARM_POLL_SECONDS"
              done

              if [ "$ALARM_READY_REACHED" != 'true' ]; then
                rm -f "$ALARM_V1_INVOKE" "$ALARM_V1_PAYLOAD" "$METRIC_DATA" "$METRIC_QUERIES"
                echo 'Orders errors alarm did not reach OK with a real zero-error datapoint.' >&2
                exit 1
              fi

              rm -f "$ALARM_V1_INVOKE" "$ALARM_V1_PAYLOAD" "$METRIC_QUERIES"
              chown cloud_user:cloud_user "$ALARM_BEFORE" "$ALARM_READY" "$ALARM_ZERO"
            }

            signal_bootstrap() {
              UNIQUE_ID="$INSTANCE_ID"
              if [ "$1" = 'FAILURE' ]; then
                UNIQUE_ID="$INSTANCE_ID-$BOOTSTRAP_STAGE"
              fi
              aws cloudformation signal-resource \
                --stack-name "$STACK_NAME" \
                --logical-resource-id LabWorkstation \
                --unique-id "$UNIQUE_ID" \
                --status "$1" \
                --region "$AWS_REGION" \
                --no-cli-pager
            }
            download_asset() {
              local asset_name="$1" expected_sha="$2" destination="$3" file_mode="$4"
              local temporary_file="$destination.download"
              rm -f "$temporary_file"
              for attempt in 1 2 3; do
                if curl --fail --location --silent --show-error \
                  --connect-timeout 10 --max-time 60 \
                  "$ASSET_BASE_URL/$asset_name" -o "$temporary_file" &&
                  printf '%s  %s\n' "$expected_sha" "$temporary_file" | sha256sum --check --status; then
                  chown cloud_user:cloud_user "$temporary_file"
                  chmod "$file_mode" "$temporary_file"
                  mv -f "$temporary_file" "$destination"
                  return 0
                fi
                rm -f "$temporary_file"
                sleep 2
              done
              return 1
            }
            trap 'signal_bootstrap FAILURE' ERR

            install -d -o cloud_user -g cloud_user \
              "$LAB_ROOT/assets/function" \
              "$LAB_ROOT/appspec" \
              "$LAB_ROOT/bin" \
              "$LAB_ROOT/output" \
              "$LAB_ROOT/state"
            BOOTSTRAP_STAGE=asset-download
            download_asset "$V2_ASSET" "$V2_SHA256" "$V2_ARCHIVE" 0644
            download_asset "$APPSPEC_ASSET" "$APPSPEC_SHA256" "$LAB_ROOT/appspec/release-v2.json" 0644
            download_asset "$INVOKE_LOOP_ASSET" "$INVOKE_LOOP_SHA256" "$LAB_ROOT/bin/invoke-loop" 0755
            download_asset "$RECORD_OUTCOME_ASSET" "$RECORD_OUTCOME_SHA256" "$LAB_ROOT/bin/record-outcome" 0755
            BOOTSTRAP_STAGE=sts-credentials
            for attempt in $(seq 1 30); do
              if aws sts get-caller-identity >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            aws sts get-caller-identity >/dev/null
            prewarm_alarm &
            ALARM_PID=$!
            BOOTSTRAP_STAGE=invoke-helper-install
            BOOTSTRAP_STAGE=lambda-update-readiness
            UPDATE_PERMISSION_READY=false
            UPDATE_ERROR=$(mktemp)
            for attempt in $(seq 1 30); do
              if aws lambda update-function-code \
                --function-name "$FUNCTION_NAME" \
                --zip-file "fileb://$V2_ARCHIVE" \
                --dry-run \
                --no-cli-pager >/dev/null 2>"$UPDATE_ERROR"; then
                UPDATE_PERMISSION_READY=true
                break
              fi
              sleep 2
            done

            if [ "$UPDATE_PERMISSION_READY" != 'true' ]; then
              BOOTSTRAP_STAGE=$(classify_update_error "$(cat "$UPDATE_ERROR")")
              echo "V2 bootstrap readiness failed at $BOOTSTRAP_STAGE." >&2
              exit 1
            fi
            rm -f "$UPDATE_ERROR"
            BOOTSTRAP_STAGE=lambda-publish
            V2_VERSION=$(aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file "fileb://$V2_ARCHIVE" \
              --publish \
              --query Version \
              --output text \
              --no-cli-pager)

            BOOTSTRAP_STAGE=lambda-wait
            aws lambda wait function-updated-v2 \
              --function-name "$FUNCTION_NAME"

            BOOTSTRAP_STAGE=lambda-version-check
            if [ "$V2_VERSION" != '2' ]; then
              echo "Expected published version 2, received $V2_VERSION." >&2
              exit 1
            fi

            BOOTSTRAP_STAGE=seed-verification
            verify_seed_state

            BOOTSTRAP_STAGE=state-file
            printf '%s\n' "$V2_VERSION" > "$LAB_ROOT/state/v2-version.txt"
            chown cloud_user:cloud_user "$LAB_ROOT/state/"*

            BOOTSTRAP_STAGE=alarm-prewarm
            if ! wait "$ALARM_PID"; then
              signal_bootstrap FAILURE
              exit 1
            fi

            BOOTSTRAP_STAGE=iam-policy-delete
            aws iam delete-role-policy \
              --role-name "$ROLE_NAME" \
              --policy-name "$BOOTSTRAP_POLICY_NAME"

            BOOTSTRAP_STAGE=complete
            signal_bootstrap SUCCESS
            trap - ERR

Outputs:
  pubIpAddress:
    Description: Public IP address of the lab workstation.
    Value:
      Fn::GetAtt:
        - LabWorkstation
        - PublicIp

  OrdersFunctionName:
    Description: Name of the orders Lambda function.
    Value:
      Ref: OrdersFunction

  OrdersProdAliasName:
    Description: Name of the production Lambda alias.
    Value: prod

  OrdersV1Version:
    Description: Published version for the healthy v1 orders Lambda function.
    Value:
      Fn::GetAtt:
        - OrdersV1Version
        - Version

  OrdersV2Version:
    Description: Published version for the deterministic failing v2 orders Lambda function.
    Value: '2'

  OrdersCodeDeployApplicationName:
    Description: Name of the CodeDeploy application.
    Value:
      Ref: OrdersCodeDeployApplication

  OrdersDeploymentGroupName:
    Description: Name of the CodeDeploy deployment group.
    Value:
      Ref: OrdersDeploymentGroup

  OrdersErrorsAlarmName:
    Description: Name of the independent Lambda errors alarm.
    Value:
      Ref: OrdersErrorsAlarm

  OrdersCodeDeployServiceRoleArn:
    Description: ARN of the CodeDeploy service role.
    Value:
      Fn::GetAtt:
        - OrdersCodeDeployServiceRole
        - Arn

  LabWorkstationId:
    Description: Instance ID of the lab workstation.
    Value:
      Ref: LabWorkstation

  LabWorkstationRoleArn:
    Description: ARN of the scoped role used by the lab workstation.
    Value:
      Fn::GetAtt:
        - LabWorkstationRole
        - Arn

  LabWorkstationPrivateIp:
    Description: Private IP address of the lab workstation.
    Value:
      Fn::GetAtt:
        - LabWorkstation
        - PrivateIp
